# Telemetry stack for compose.yaml (see TELEMETRY.md). Included by compose.yaml.
services:
  # Telemetry stack: Scion (OTLP) -> otel-collector -> Prometheus -> Grafana. See TELEMETRY.md.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./telemetry/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:${OTEL_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${OTEL_HTTP_PORT:-4318}:4318"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
    volumes:
      - ./telemetry/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - otel-collector
      - run-exporter
    restart: unless-stopped

  # Factory runs (Beads epics) as asf_run_* metrics, to group agent telemetry per run.
  run-exporter:
    image: asf-run-exporter:1   # built locally, like dolt
    build:
      context: ./telemetry/run-exporter
    env_file:
      - path: .env.secrets   # DOLT_DB_PASSWORD
        required: false
    environment:
      DOLT_HOST: dolt
      DOLT_PORT: "3306"
      DOLT_DB_USER: ${DOLT_DB_USER:-beads}
      RUN_EXPORTER_ROLES_DIR: /templates
      RUN_EXPORTER_MAX_AGE_DAYS: ${RUN_EXPORTER_MAX_AGE_DAYS:-30}
    volumes:
      - ./templates:/templates:ro
    ports:
      - "127.0.0.1:${RUN_EXPORTER_PORT:-9105}:9105"
    depends_on:
      dolt:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./telemetry/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./telemetry/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
