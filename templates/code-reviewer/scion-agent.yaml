schema_version: "1"
description: "Senior code reviewer — evaluates changes across correctness, readability, architecture, security, and performance"
agent_instructions: agents.md
system_prompt: system-prompt.md
model: medium

max_model_calls: 60
max_duration: "45m"

skills:
  - uri: "skill://scion/global/output-discipline"
  - uri: "skill://scion/global/structural-code-search"
  - uri: "skill://scion/global/beads-work-tracking"
  # code-review absorbs the universally-applicable parts of addyosmani's
  # code-review-and-quality. That skill is deliberately NOT listed here: its severity
  # semantics ("Nit: author may ignore") contradict software-engineering-process
  # → The review cycle, and sourcing both would hand the agent two conflicting rules.
  - uri: "skill://scion/global/code-review"
  # code-review delegates severity disposition, the review cycle and sizing
  # thresholds to software-engineering-process — "go read it rather than
  # guessing" — and the exclusion reasoned about in the comment above is
  # decided by that same skill. Both need it present.
  - uri: "skill://scion/global/software-engineering-process"
  - uri: "gh://addyosmani/agent-skills/code-simplification"
  - uri: "gh://addyosmani/agent-skills/performance-optimization"
  - uri: "gh://addyosmani/agent-skills/using-agent-skills"
