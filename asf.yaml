# ASF configuration: common settings for setup and the agents.
#
# Do not edit this file for your own machine. Put the keys you want to change in
# asf.local.yaml (same structure, gitignored), e.g.:
#
#   mlflow:
#     provider: openai
#     endpoints:
#       large: gpt-5.5
#
# Secrets (MODEL_PROVIDER_API_KEY, passwords, AGENT_GATEWAY_API_KEY) belong in .env.secrets.
# ./setup.py applies changes: it writes .env for docker compose, ~/.scion/settings.yaml
# and the Hub variables agents receive.

scion:
  # Scion runs on this machine: `scion server start` (Hub, hosted Runtime Broker, web UI).
  hub_url: http://127.0.0.1:8080
  broker_url: http://127.0.0.1:9800
  # Registry prefix images are tagged with and pulled from when not built locally
  # (CI can publish there, see .github/workflows/build.yml).
  image_registry: ghcr.io/dewire
  # Where setup installs the scion CLI built from ./scion.
  install_path: ~/.local/bin/scion
  # Used for new agents from both the CLI and web UI; published to the Hub.
  # Choose asf-opencode or any installed asf-opencode-<tools> variant.
  default_harness_config: asf-opencode
  # Project shared directories every agent gets (/scion-volumes/<name>).
  shared_dirs: [scratchpad, build-cache]

# The OpenAI-compatible endpoint agents send model requests to. Agents only see
# AGENT_GATEWAY_URL / AGENT_GATEWAY_TYPE / AGENT_GATEWAY_API_KEY, so the gateway
# can be replaced without touching templates or the harness.
agent_gateway:
  # mlflow: the local MLflow AI Gateway below; enables endpoint discovery and
  # MLflow trace headers. Anything else: plain OpenAI-compatible gateway.
  type: mlflow
  # Base URL of the OpenAI-compatible API, as seen from agent containers (they
  # use host networking). Empty with type mlflow: http://localhost:<mlflow.port>/gateway/mlflow/v1
  url: ""
  # The gateway must serve these model names; templates use the sizes.
  models: [small, medium, large]
  context_management:
    # Declares a context window on the gateway models so OpenCode compacts the
    # session before the provider rejects it. false: OpenCode's own defaults.
    enabled: true
    # Context window in tokens (use the smallest window of the models you route to).
    context_window: 128000

# The local MLflow AI Gateway (docker compose service "mlflow").
mlflow:
  port: 5001
  # Provider MLflow routes every endpoint to: any MLflow AI Gateway provider
  # (anthropic, openai, gemini, openrouter, openai_compatible, ollama, github_copilot, ...).
  # Its API key is MODEL_PROVIDER_API_KEY in .env.secrets (setup asks for it).
  # github_copilot needs no key: make setup-copilot logs MLflow in to GitHub.
  provider: anthropic
  # Base URL for openai_compatible, ollama or a proxy, as seen from the MLflow
  # container (host services: http://host.docker.internal:<port>). Empty: provider default.
  api_base: ""
  # Provider model behind each endpoint; "model:weight,model:weight" splits traffic.
  endpoints:
    small: claude-haiku-5-5
    medium: claude-sonnet-5-5
    large: claude-opus-5-5

# Dolt server holding the Beads databases (docker compose service "dolt").
dolt:
  port: 3307
  # Fixed once the database is created; changing them later needs a new volume.
  database: beads
  user: beads

beads:
  # Each project gets its own database on the Dolt server, named after the
  # project: beads_<project-slug> (e.g. beads_order_service_api).
  # Issue ID prefix for new project databases. Empty: abbreviated from the
  # project slug (order-service-api -> osa-a1b, ai-software-factory -> asf-a1b).
  # A value here applies to every new project; existing databases keep their prefix.
  prefix: ""

# Legacy settings for scripts/cross-project.py. The installed shell command
# scion cross-project setup stores its selection as JSON in Scion home instead.
# See docs/cross-project.md.
cross_project:
  enabled: false
  # Project slug -> name of the agent that receives delegated work there.
  # Example:
  #   projects:
  #     ai-software-factory: coordinator
  #     order-service-api: coordinator
  projects: {}
  # Who may message into the listed projects: members (agents started by a
  # member of that project) or any (every agent on this Hub).
  inbound: members

# Scion agent telemetry: OTLP metrics/traces -> otel-collector -> Prometheus -> Grafana
# (http://localhost:3000; see TELEMETRY.md). Written to ~/.scion/settings.yaml.
telemetry:
  enabled: true
  otlp_endpoint: localhost:4317

# Rootless Docker daemon on the host for agent Testcontainers integration tests (Linux only).
# Mounted into agents at /run/testcontainers/docker.sock so agents can run test
# containers without root access to the host's main Docker daemon.
testcontainers:
  enabled: true
  # Empty: /run/user/<uid>/docker.sock (standard rootless Docker socket path).
  socket: ""
